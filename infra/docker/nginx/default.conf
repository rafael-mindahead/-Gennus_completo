
server {
    listen 80;
    server_name localhost;

    root /var/www/frontend;
    index index.html;

    # Frontend estático
    location / {
        try_files $uri $uri/ =404;
    }

    # Recursos estáticos: caminhos absolutos do frontend (/assets/css e /assets/js).
    # No ambiente local, evitar cache antigo após alterações no VS Code.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API do Laravel
    location ^~ /api/ {
        try_files /_gennus_route_ @laravel;
    }

    # Health check do Laravel
    location = /up {
        try_files /_gennus_route_ @laravel;
    }

    # Compatibilidade futura com o frontend antigo
    location ^~ /php/ {
        try_files /_gennus_route_ @laravel;
    }

    # Encaminhamento ao PHP-FPM
    location @laravel {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME
            /var/www/backend/public/index.php;

        fastcgi_param SCRIPT_NAME /index.php;

        fastcgi_pass app:9000;
    }

    # Impedir execução direta de arquivos PHP
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
