# Dev environment for Gennus 2.0: separate ports, volumes and DB.
# Requires backend/.env (copy from backend/.env.example).
services:
  api:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/var/www/html/.env
    depends_on:
      mysql_v2:
        condition: service_healthy
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - api
    restart: unless-stopped
  mysql_v2:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gennus_v2
      MYSQL_USER: gennus_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev_only_change_me}
      MYSQL_ROOT_PASSWORD: ${GENNUS_V2_MYSQL_ROOT_PASSWORD:-dev_root_only_change_me}
    volumes:
      - gennus_v2_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
    restart: unless-stopped
volumes:
  gennus_v2_mysql_data:
