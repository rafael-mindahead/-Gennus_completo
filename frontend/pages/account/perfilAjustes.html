<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gennus - Editar Perfil</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css">
<script src="/assets/js/common.js"></script>
<script src="/assets/js/session.js"></script>
</head>
<body>
    <main class="dashboard-page">
        <nav class="sidebar-main">
            <div class="sidebar-logo">GENNUS</div>
            <div class="sidebar-menu">
                <a href="/pages/erp/dashboard.html" class="sidebar-link-root">Voltar ao Painel</a>
            </div>
        </nav>

        <div class="dashboard-content">
            <h1>Configurações de Perfil</h1>
            
            <div class="card-base" style="max-width: 600px;">
                <form id="profile-form">
                    <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" id="edit-name" required>
                    </div>
                    <div class="input-group">
                        <label>E-mail (Login)</label>
                        <input type="email" id="edit-email" readonly style="opacity: 0.5;">
                        <small style="color: var(--texto-muted);">O e-mail não pode ser alterado.</small>
                    </div>
                    <div class="input-group">
                        <label>Nova Senha</label>
                        <input type="password" id="edit-password" placeholder="Deixe em branco para manter a atual">
                    </div>
                    <hr style="border: 0; border-top: 1px solid var(--borda); margin: 20px 0;">
                    <button type="submit">Salvar Alterações</button>
                    <a href="/pages/erp/dashboard.html" style="color: var(--texto-muted); text-decoration: none; margin-left: 20px; font-size: 0.9rem;">Cancelar</a>
                </form>
            </div>
        </div>
    </main>

    <script src="/assets/js/profile.js"></script>
</body>
</html>
