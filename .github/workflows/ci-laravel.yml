name: Laravel 13 checks
on:
  push:
    branches: ['develop/**']
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, xml, curl, zip, intl
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Laravel tests
        run: php artisan test
      - name: Lint custom PHP
        run: |
          find app routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
  build:
    runs-on: ubuntu-latest
    needs: laravel
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker application
        run: docker build -f infra/docker/php/Dockerfile -t gennus2-test:ci .
