name: Legacy regression (read-only)
on:
  push:
    branches: ['develop/**']
  pull_request:

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint existing PHP
        run: find app public/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check links and JS syntax
        run: python3 -m unittest discover -s tests -p test_paths.py -v
      - name: Check frontend calculations and errors
        run: node --test tests/test_frontend.cjs
      # Tests/test_api.py write to DB and must never be executed against production.
